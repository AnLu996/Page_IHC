<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantalla Dividida con Videos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      height: 100vh;
      display: flex;
      overflow: hidden;
      background: #000;
    }
    
    /* ===== LOADER ===== */
    #loader {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #111, #1e3c72);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 9999;
      transition: opacity 1s ease;
    }
    
    #loader h1 {
      font-size: 3em;
      letter-spacing: 2px;
    }
    
    #loader p {
      opacity: 0.8;
      margin-top: 10px;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      margin-top: 25px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* ===== SECCIONES ===== */
    .section {
      flex: 1;
      position: relative;
      overflow: hidden;
      transition: flex 0.5s ease, filter 0.5s ease;
      cursor: pointer;
    }
    
    .section video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .section .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.6),
      rgba(0,0,0,0.85)
      );
      transition: opacity 0.4s;
    }

    .section {
      display: flex;
      justify-content: center;
    }

    .section .content {
      position: absolute;
      bottom: 15%;          /* 🔥 baja el contenido */
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
      color: white;
    }

    
    .section h1 {
      font-size: 3.2em;
      margin-bottom: 10px;
    }
    
    .section p {
      font-size: 1.2em;
      opacity: 0.85;
      margin-bottom: 25px;
    }
    
    .section button {
      background: #FFC107;
      color: #111;
      border: none;
      padding: 14px 35px;
      border-radius: 30px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .section button:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 25px rgba(255,193,7,0.5);
    }
    
    /* ===== INTERACCIÓN ===== */
    .section:hover {
      flex: 1.2;
    }
    
    .section:hover .overlay {
      opacity: 0.4;
    }
    
    .section:not(:hover) {
      filter: grayscale(0.4);
    }
    
    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .section {
        height: 50%;
      }
    }
    
  </style>
</head>
<body>
  
  <!-- Loader -->
  <div id="loader">
    <h1>Proyecto IHC</h1>
    <p>Cargando experiencia ...</p>
    <div class="spinner"></div>
  </div>
  
  <div class="section project">
    <video autoplay muted loop>
      <source src="assets/videos/FondoProyectoIndex.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    <div class="content">
      <h1>Proyecto</h1>
      <p>Investigación, diseño y experiencia de usuario</p>
      <button onclick="location.href='proyecto.html'">Explorar Proyecto</button>
    </div>
  </div>
  
  <div class="section game">
    <video autoplay muted loop>
      <source src="assets/videos/FondoJuegoIndex.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    <div class="content">
      <h1>Juego</h1>
      <p>Simulación interactiva y experiencia inmersiva</p>
      <button onclick="location.href='juego.html'">Explorar Juego</button>
    </div>
  </div>
  
  
  <script>
    // Esperar unos segundos antes de ocultar el loader
    window.addEventListener("load", () => {
      const loader = document.getElementById("loader");
      setTimeout(() => {
        loader.style.opacity = "0";
        setTimeout(() => loader.remove(), 1000);
      }, 1800);
    });
    
  </script>
  
</body>
</html>
